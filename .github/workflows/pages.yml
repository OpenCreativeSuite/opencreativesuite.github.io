name: Deploy site

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout site
        uses: actions/checkout@v4

      - name: Checkout Donkeh framework
        uses: actions/checkout@v4
        with:
          repository: barely-sentient/donkeh-ui
          path: .donkeh

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Publish WebAssembly site
        env:
          DONKEH_ROOT: ${{ github.workspace }}/.donkeh/Donkeh
        run: dotnet publish OpenCreativeSuite.csproj -c Release -f net10.0-browser

      - name: Stage docs folder
        run: node scripts/stage-docs.mjs

      - name: Commit docs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs
          if git diff --cached --quiet; then
            echo "No docs changes to commit."
            exit 0
          fi
          git commit -m "Build WebAssembly site [skip ci]"
          git push origin HEAD:${GITHUB_REF_NAME}
